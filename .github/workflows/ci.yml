name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Scan workflows (zizmor + pinact)
        run: |
          zizmor .github/dependabot.yml .github/workflows/*.yml --no-exit-codes
          pinact run --verify .github/workflows/*.yml

  cargo:
    name: Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Soft-skip or run cargo checks
        run: |
          if [[ ! -f Cargo.toml ]]; then
            echo "No Cargo.toml yet — skipping cargo checks (template scaffold)."
            exit 0
          fi
          rustup show
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
